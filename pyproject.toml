[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sievesafe"
dynamic = ["version"]
description = "Zero-shot title/abstract screening for systematic reviews that auto-excludes only below a pre-specified threshold"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/Lucasfarg/sievesafe"
Issues = "https://github.com/Lucasfarg/sievesafe/issues"

[project.scripts]
sievesafe = "sievesafe.cli:main"

[tool.setuptools.dynamic]
version = { attr = "sievesafe.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sievesafe = ["page.html", "evidence.txt"]

[tool.ruff]
line-length = 165
